# Nginx configuration for d.onl (PRODUCTION)
# Copy to: /etc/nginx/sites-available/d.onl
# Enable: sudo ln -sf /etc/nginx/sites-available/d.onl /etc/nginx/sites-enabled/

# Upstream for FastAPI uvicorn
upstream donl_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name d.onl www.d.onl;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html/certbot-webroot;
    }

    location / {
        return 301 https://d.onl$request_uri;
    }
}

# www -> non-www redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.d.onl;

    ssl_certificate /etc/letsencrypt/live/d.onl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d.onl/privkey.pem;

    return 301 https://d.onl$request_uri;
}

# HTTPS server (PRODUCTION)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name d.onl;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/d.onl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d.onl/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Logs
    access_log /var/log/nginx/d.onl.access.log;
    error_log /var/log/nginx/d.onl.error.log;

    # Max body size
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # API endpoints -> FastAPI
    location /api/ {
        proxy_pass http://donl_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check
    location /health {
        proxy_pass http://donl_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # OpenAPI schema
    location /openapi.json {
        proxy_pass http://donl_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API docs
    location /api/docs {
        proxy_pass http://donl_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/redoc {
        proxy_pass http://donl_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static files (frontend SPA)
    location / {
        root /var/www/html/d.onl/web;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Locales
    location /locales/ {
        root /var/www/html/d.onl;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ \.env$ {
        deny all;
    }

    location ~ \.py$ {
        deny all;
    }
}
