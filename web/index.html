    <!-- Core Scripts (load in order) -->
    <!-- Add cache-busting timestamp to force reload -->
    <script>
        const CACHE_BUST = '?v=' + Date.now();
        
        // Load scripts with error handling
        function loadScript(src, onError) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src + CACHE_BUST; // Add cache-busting
                script.onload = () => {
                    console.log('[Init] Loaded:', src);
                    resolve();
                };
                script.onerror = () => {
                    console.error('[Init] Failed to load:', src);
                    if (onError) onError();
                    reject(new Error(`Failed to load ${src}`));
                };
                document.head.appendChild(script);
            });
        }

        // Load all scripts sequentially
        (async function() {
            try {
                // 1. Core dependencies
                await loadScript('/static/api.js');
                await loadScript('/static/i18n.js');
                await loadScript('/static/router.js', () => {
                    document.getElementById('main-content').innerHTML = `
                        <div class="alert alert-danger">
                            <h4>Critical Error</h4>
                            <p>Failed to load router.js</p>
                            <p>Check if file exists at: <code>/static/router.js</code></p>
                            <p>Check browser Network tab (F12) for 404 errors</p>
                        </div>
                    `;
                });
                
                // 2. App class definition (must load before modules)
                await loadScript('/static/js/app-class.js');
                
                // 3. Module files that extend App.prototype
                await loadScript('/static/js/ui.js');
                await loadScript('/static/js/auth.js');
                await loadScript('/static/js/dashboard.js');
                await loadScript('/static/js/domains.js');
                await loadScript('/static/js/comments.js');
                await loadScript('/static/js/ratings.js');
                await loadScript('/static/js/wallet.js');
                await loadScript('/static/js/widgets.js');
                
                // 4. App core (init, routes, refresh, instantiation) - loads LAST
                await loadScript('/static/app.js');
                
                console.log('[Init] All scripts loaded');
                console.log('[Init] API:', typeof api !== 'undefined' ? '✓' : '✗');
                console.log('[Init] i18n:', typeof i18n !== 'undefined' ? '✓' : '✗');
                console.log('[Init] Router:', typeof router !== 'undefined' ? '✓' : '✗');
                console.log('[Init] App class:', typeof App !== 'undefined' ? '✓' : '✗');
                console.log('[Init] App instance:', typeof app !== 'undefined' ? '✓' : '✗');
                
                // Start app initialization after all scripts loaded
                // Since scripts load dynamically, DOM is already ready
                console.log('[Init] Starting app initialization...');
                // Small delay to ensure all modules are fully initialized
                setTimeout(() => {
                    if (typeof startApp === 'function') {
                        startApp();
                    } else {
                        console.error('[Init] startApp function not found!');
                    }
                }, 50);
            } catch (error) {
                console.error('[Init] Script loading failed:', error);
            }
        })();
    </script>
